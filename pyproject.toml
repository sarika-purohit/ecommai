[project]
name = "ecommai"
version = "0.1.0"
description = "Shopping agent that checks every must-have on every product and shows the proof"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "google-auth[requests]>=2.30",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "firebase-admin>=6.5",
    "kagglehub>=0.3",
    "pillow>=10.4",
    "tzdata>=2024.1",
    "google-adk>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls real Google Cloud or Kaggle services; run on demand with `pytest -m live`",
]
addopts = "-m 'not live'"
